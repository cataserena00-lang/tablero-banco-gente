name: Inspeccionar base PPP

# Temporal: imprime solo la estructura de la base (sin filas ni datos personales) para diseñar el tablero.
on:
  push:
    branches: [claude/primer-paso]
    paths: [".github/workflows/inspeccionar-ppp.yml", "pipelines/primer_paso/inspeccionar.py"]

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas openpyxl google-api-python-client google-auth
      - env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PPP_DRIVE_CARPETA_ID: 1zqQNYIqiKUpLYXNiEldGZ2MgwD1isvmi
        run: python pipelines/primer_paso/inspeccionar.py
