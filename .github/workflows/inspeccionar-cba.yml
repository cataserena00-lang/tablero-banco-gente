name: Inspeccionar bases CBA me capacita

# Temporal: imprime solo la estructura de las bases (sin filas ni datos personales) para diseñar el tablero.
on:
  push:
    branches: [claude/cba-me-capacita]
    paths: [".github/workflows/inspeccionar-cba.yml", "pipelines/cba_me_capacita/inspeccionar.py"]

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas openpyxl google-api-python-client google-auth
      - env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CBA_DRIVE_CARPETA_ID: 1181tR00Do2Qb1pR1bYP0ouo2rerhPlS2
        run: python pipelines/cba_me_capacita/inspeccionar.py
