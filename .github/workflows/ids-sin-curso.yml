name: IDs de ASECOR sin curso (temporal)

on:
  push:
    branches: [claude/cmc-ids-sin-curso]
    paths: [".github/workflows/ids-sin-curso.yml", "pipelines/cba_me_capacita/ids_sin_curso.py"]

permissions:
  contents: write

jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas openpyxl google-api-python-client google-auth
      - env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CBA_DRIVE_CARPETA_ID: 1181tR00Do2Qb1pR1bYP0ouo2rerhPlS2
        run: python pipelines/cba_me_capacita/ids_sin_curso.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f tmp_ids/ids_sin_curso.xlsx
          git commit -m "IDs sin curso (temporal) [skip ci]"
          git push
