name: Actualizar personas

# Carga ESTADOS CREDITOS BG.csv (Drive) a la base de personas en Neon, para la vista nominal del tablero.
# Los datos son NOMINALES: no se commitean ni se imprimen en el log (solo cantidades y nombres de columnas).
on:
  schedule:
    - cron: "30 9 * * 1"     # lunes 06:30 hora Argentina (09:30 UTC)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Recargar aunque el archivo no haya cambiado"
        type: boolean
        default: false
      solo_encabezado:
        description: "Solo mostrar las columnas del CSV (no carga nada ni necesita Neon)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  personas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipelines/requirements.txt }
      - run: pip install -r pipelines/requirements.txt
      - name: Cargar personas
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BG_ESTADOS_FILE_ID: ${{ vars.BG_ESTADOS_FILE_ID || '1MwkGjSMb_Qq1aRBN4l6h5d1mM4WYn0Ha' }}
          NEON_DATABASE_URL_CARGA: ${{ secrets.NEON_DATABASE_URL_CARGA }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
          SOLO_ENCABEZADO: ${{ inputs.solo_encabezado && '1' || '' }}
        run: |
          if [ -n "$SOLO_ENCABEZADO" ]; then
            python pipelines/banco_gente/cargar_personas.py --solo-encabezado
          elif [ -z "$NEON_DATABASE_URL_CARGA" ]; then
            echo "Falta el secreto NEON_DATABASE_URL_CARGA (Settings > Secrets and variables > Actions): no se carga nada."
          else
            python pipelines/banco_gente/cargar_personas.py
          fi
