name: CI

# Se corre en cada Pull Request y en cada cambio a main: tipos, build, pruebas de seguridad, pruebas de Python, auditoría de dependencias y búsqueda de secretos.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas de seguridad (acceso, sesiones, autenticador)
        run: npm run test:seguridad
      - name: Build
        run: npm run build
      - name: Auditoría de dependencias (crítico; las excepciones están en seguridad/advisories-revisados.json)
        run: npm audit --omit=dev --audit-level=critical

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r pipelines/requirements.txt pytest
      - run: python -m pytest pipelines -q

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
