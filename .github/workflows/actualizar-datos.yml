name: Actualizar datos

on:
  schedule:
    # Lunes 16:00 y miércoles 14:00, hora de Argentina (UTC-3): levanta las bases nuevas de la carpeta de Drive
    - cron: "0 19 * * 1"
    - cron: "0 17 * * 3"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Regenerar aunque el archivo no haya cambiado"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  banco-gente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements.txt
      - run: pip install -r pipelines/requirements.txt
      - name: Procesar Banco de la Gente
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BG_DRIVE_CARPETA_ID: ${{ vars.BG_DRIVE_CARPETA_ID || '1QBqTJIaitDlqKRT89CQ_2uY4BC7gtLHl' }}
          BG_DRIVE_FILE_ID: ${{ vars.BG_DRIVE_FILE_ID }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: python pipelines/banco_gente/procesar.py
      # Listado de créditos pendientes (NOMINAL) en Neon, para exportar a Excel por zona desde las fichas.
      # No se commitea ni se imprime en el log (solo cantidades). Sin el secreto NEON_DATABASE_URL_CARGA no se carga nada.
      - name: Cargar pendientes a Neon
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BG_DRIVE_CARPETA_ID: ${{ vars.BG_DRIVE_CARPETA_ID || '1QBqTJIaitDlqKRT89CQ_2uY4BC7gtLHl' }}
          BG_DRIVE_FILE_ID: ${{ vars.BG_DRIVE_FILE_ID }}
          NEON_DATABASE_URL_CARGA: ${{ secrets.NEON_DATABASE_URL_CARGA }}
          FORZAR: ${{ inputs.forzar && '1' || '' }}
        run: |
          if [ -z "$NEON_DATABASE_URL_CARGA" ]; then
            echo "Falta el secreto NEON_DATABASE_URL_CARGA: no se carga la base de pendientes."
          else
            python pipelines/banco_gente/cargar_pendientes.py
          fi
      - name: Commit de datos (dispara el deploy en Vercel)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Actualización automática de datos" && git pull --rebase origin main && git push)
